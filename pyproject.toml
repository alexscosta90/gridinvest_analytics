[project]
name = "gridinvest-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0,<7",
    "duckdb>=2.0.0",
    "pandas>=3.1.0,<4",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
addopts = "-v --basetemp=tmp_pytest"
testpaths = ["tests"]
